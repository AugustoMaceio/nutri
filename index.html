<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Plano Nutricional - Augusto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="stylesheet" href="style.css">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#a0f399",
                        "on-secondary": "#ffffff",
                        "outline": "#6f7a6b",
                        "surface-subtle": "#F1F5F1",
                        "secondary": "#1b6d24",
                        "inverse-on-surface": "#edf3e7",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e4eade",
                        "secondary-fixed": "#a3f69c",
                        "on-tertiary-fixed-variant": "#861948",
                        "tertiary-container": "#f26f9d",
                        "primary-fixed-dim": "#78dc77",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffd9e2",
                        "success-light": "#E8F5E9",
                        "on-primary-fixed-variant": "#005313",
                        "outline-variant": "#becab9",
                        "on-secondary-container": "#217128",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#88d982",
                        "surface-bright": "#f5fbef",
                        "surface-tint": "#006e1c",
                        "slate-gray": "#455A64",
                        "on-primary-container": "#003c0b",
                        "surface-container-low": "#f0f6ea",
                        "background": "#f5fbef",
                        "on-background": "#171d16",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3f4a3c",
                        "on-tertiary-container": "#690034",
                        "primary-container": "#4caf50",
                        "inverse-surface": "#2c322a",
                        "primary": "#006e1c",
                        "surface": "#f5fbef",
                        "surface-container-highest": "#dee4d9",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-faint": "#F8FAF8",
                        "on-primary-fixed": "#002204",
                        "on-secondary-fixed": "#002204",
                        "tertiary-fixed-dim": "#ffb1c7",
                        "inverse-primary": "#78dc77",
                        "on-tertiary-fixed": "#3e001c",
                        "surface-variant": "#dee4d9",
                        "surface-dim": "#d6dcd0",
                        "surface-container": "#eaf0e4",
                        "primary-fixed": "#94f990",
                        "tertiary": "#a63360",
                        "on-surface": "#171d16",
                        "on-secondary-fixed-variant": "#005312"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "32px",
                        "gutter-sm": "12px",
                        "margin-mobile": "16px",
                        "gutter-md": "20px",
                        "container-max-width": "600px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="font-body-md text-on-background selection:bg-secondary-container selection:text-on-secondary-container">
    <!-- TopAppBar -->
    <header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container shadow-sm fixed top-0 w-full z-50 flex flex-col items-center justify-center py-4 px-4 text-center">
        <div class="flex items-center gap-2 mb-1">
            <span class="material-symbols-outlined text-headline-lg-mobile" data-icon="nutrition">nutrition</span>
            <h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold">Plano Nutricional</h1>
        </div>
        <span class="text-label-md font-label-md opacity-90">Augusto</span>
    </header>

    <!-- Main Content -->
    <main class="max-w-[600px] mx-auto px-margin-mobile pt-32 pb-32">
        
        <!-- View: Plano -->
        <div id="view-plano">
            <section class="mb-8">
                <label class="text-label-md font-label-md text-on-surface-variant mb-2 block" for="momentoSelect">Momento:</label>
                <div class="relative">
                    <select id="momentoSelect" class="w-full bg-surface-subtle border-none rounded-xl py-4 px-4 text-body-md font-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary transition-all shadow-sm cursor-pointer"></select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
                        <span class="material-symbols-outlined text-outline">expand_more</span>
                    </div>
                </div>
            </section>
            
            <div id="conteudo"></div>
            
            <!-- Daily Progress Card inside Plano -->
            <section class="mt-margin-desktop bg-surface-container rounded-2xl p-margin-mobile">
                <h3 class="text-headline-sm font-headline-sm text-on-surface mb-4">Progresso Diário</h3>
                <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-label-md font-label-md text-on-surface-variant">Metas de Refeições</span>
                        <span id="textoProgresso" class="text-label-md font-label-md text-primary">0/0 opções realizadas</span>
                    </div>
                    <div class="w-full bg-outline-variant h-2.5 rounded-full overflow-hidden">
                        <div class="bg-primary h-full w-[0%] rounded-full transition-all duration-1000" id="barraProgresso"></div>
                    </div>
                </div>
            </section>
        </div>

        <!-- View: Resumo -->
        <div id="view-resumo" class="hidden">
            <section class="mb-8">
                <h2 class="text-headline-md font-headline-md text-primary mb-6">Resumo de Calorias</h2>
                
                <div class="bg-surface-container-lowest rounded-xl p-margin-mobile shadow-[0px_4px_12px_rgba(0,0,0,0.05)] mb-6">
                    <h3 class="text-headline-sm font-headline-sm text-on-surface mb-4">Calorias Estimadas Hoje</h3>
                    <div class="text-headline-xl font-headline-xl text-primary mb-2" id="totalKcalHoje">0 kcal</div>
                    
                    <div class="space-y-3 mt-6">
                        <div>
                            <div class="flex justify-between text-label-md font-label-md mb-1">
                                <span class="text-on-surface-variant">Carboidratos</span>
                                <span class="text-on-surface font-bold" id="totalCarbsHoje">0g</span>
                            </div>
                            <div class="w-full bg-outline-variant h-1.5 rounded-full overflow-hidden">
                                <div class="bg-tertiary h-full w-full rounded-full transition-all duration-1000"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-label-md font-label-md mb-1">
                                <span class="text-on-surface-variant">Proteínas</span>
                                <span class="text-on-surface font-bold" id="totalProteinHoje">0g</span>
                            </div>
                            <div class="w-full bg-outline-variant h-1.5 rounded-full overflow-hidden">
                                <div class="bg-primary h-full w-full rounded-full transition-all duration-1000"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-label-md font-label-md mb-1">
                                <span class="text-on-surface-variant">Gorduras</span>
                                <span class="text-on-surface font-bold" id="totalFatHoje">0g</span>
                            </div>
                            <div class="w-full bg-outline-variant h-1.5 rounded-full overflow-hidden">
                                <div class="bg-[#facc15] h-full w-full rounded-full transition-all duration-1000"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- View: Histórico -->
        <div id="view-historico" class="hidden">
            <section class="mb-8">
                <h2 class="text-headline-md font-headline-md text-primary mb-6">Histórico de Dias</h2>
                <div id="historicoDias" class="space-y-4"></div>
            </section>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface dark:bg-surface-container-low shadow-[0px_-2px_10px_rgba(0,0,0,0.05)]">
        <a id="tab-plano" class="nav-tab flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-2xl px-4 py-1.5 transition-interaction scale-90 duration-150 cursor-pointer">
            <span class="material-symbols-outlined">restaurant_menu</span>
            <span class="text-label-sm font-label-sm">Plano</span>
        </a>
        <a id="tab-resumo" class="nav-tab flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 transition-interaction hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors cursor-pointer">
            <span class="material-symbols-outlined">monitoring</span>
            <span class="text-label-sm font-label-sm">Resumo</span>
        </a>
        <a id="tab-historico" class="nav-tab flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 transition-interaction hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors cursor-pointer">
            <span class="material-symbols-outlined">history</span>
            <span class="text-label-sm font-label-sm">Histórico</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
